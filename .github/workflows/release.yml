name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Set version from tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Verify release versions
        run: |
          node - <<'NODE'
          const tag = process.env.TAG;
          const pkg = require('./package.json');
          const manifest = require('./manifest.json');
          const versions = require('./versions.json');
          if (pkg.version !== tag || manifest.version !== tag || versions[tag] !== manifest.minAppVersion) {
            throw new Error(`Tag ${tag} does not match package.json, manifest.json, and versions.json`);
          }
          NODE

      - run: npm test

      - run: npm run typecheck

      - run: npm run validate:obsidian

      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            sql/migrations/0.1.1-sync-revision.sql

      - name: Read tag message as release notes
        run: |
          {
            echo "NOTES<<EOF"
            git tag -l --format='%(contents)' "$TAG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: ${{ env.NOTES }}
          files: |
            main.js
            manifest.json
            sql/migrations/0.1.1-sync-revision.sql
